<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil Mahasiswa</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
      background-color: #f9f9f9;
    }
    .profile {
      margin-top: 40px;
    }
    .profile img {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #333;
    }
    .info {
      margin-top: 15px;
      font-size: 18px;
    }
    .social-icons {
      margin-top: 20px;
    }
    .social-icons a {
      display: inline-block;
      margin: 0 10px;
      text-decoration: none;
      font-size: 16px;
      color: white;
      background: #333;
      padding: 10px 15px;
      border-radius: 50%;
      transition: background 0.3s;
    }
    .social-icons a:hover {
      background: #555;
    }
  </style>
</head>
<body>
  <div class="profile">
    <img src="download.jpg" alt="Foto Profil">

    <!-- Informasi -->
    <div class="info">
      <p><b>Nama Mahasiswa</b> / 123456789 / Fakultas Teknik / Sistem Informasi</p>
    </div>

    <!-- Sosial Media -->
    <div class="social-icons">
      <a href="https://github.com/username" target="_blank">Github</a>
      <a href="https://instagram.com/username" target="_blank">IG</a>
      <a href="https://twitter.com/username" target="_blank">X</a>
      <a href="https://linkedin.com/in/username" target="_blank">in</a>
    </div>
  </div>
</body>
</html>
